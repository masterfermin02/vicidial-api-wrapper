name: API parity

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  parity:
    name: Diff official docs against the wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Compare function indexes
        id: parity
        run: |
          set +e
          php scripts/check-api-parity.php | tee parity.txt
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Open or update the tracking issue
        if: steps.parity.outputs.exit == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="VICIdial API docs list functions the wrapper lacks"
          body="$(printf 'The weekly parity check found documented functions without a wrapper method.\n\n```\n%s\n```\n\nRun `php scripts/check-api-parity.php` locally, add the methods (see docs/ROADMAP.md section 6), and extend AgentCoverageTest / AdminCoverageTest.\n\nWorkflow run: %s/%s/actions/runs/%s' "$(cat parity.txt)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          gh label create api-parity --description "Official VICIdial API docs drifted from the wrapper" --color D93F0B --force
          existing="$(gh issue list --label api-parity --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label api-parity --body "$body"
          fi

      - name: Fail the job when docs changed
        if: steps.parity.outputs.exit != '0'
        run: exit 1
